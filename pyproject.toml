[project]
name = "nyc-congestion"
version = "0.1.0"
description = "Causal impact of NYC congestion pricing on taxi and rideshare trips, and zone-level demand forecasting"
readme = "README.md"
authors = [
    { name = "Trivikram", email = "gsstrivikram18@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.1",
    "httpx>=0.29.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
